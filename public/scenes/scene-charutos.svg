<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pote de charutos com fumaça subindo num escritório escuro">
<style>
.c-sm{transform-box:fill-box;transform-origin:50% 100%;opacity:0;--dx:30px;animation:c-sm 7s ease-out infinite}
.c-sm.b{animation-duration:8.5s;animation-delay:-3s;--dx:-34px}
.c-sm.c{animation-duration:6.5s;animation-delay:-5s;--dx:26px}
.c-sm.d{animation-delay:-1.5s;--dx:18px}
.c-sm.e{animation-duration:9s;animation-delay:-6s;--dx:-20px}
@keyframes c-sm{0%{opacity:0;transform:translate(0,0) scale(.5)}12%{opacity:.5}60%{opacity:.28}100%{opacity:0;transform:translate(var(--dx),-420px) scale(2.6)}}
.c-em{animation:c-em 1.8s ease-in-out infinite}
.c-em.b{animation-delay:-.7s}.c-em.c{animation-delay:-1.2s}
@keyframes c-em{0%,100%{fill:#e8283c}50%{fill:#ffb347}}
.c-glow{animation:c-gl 5s ease-in-out infinite}
@keyframes c-gl{0%,100%{opacity:.35}50%{opacity:.6}}
.c-bl{animation:c-bl 6s ease-in-out infinite}
@keyframes c-bl{0%,100%{opacity:.16}50%{opacity:.3}}
</style>
<defs>
<linearGradient id="c-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#1a1d38"/></linearGradient>
<radialGradient id="c-lg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f5c04a" stop-opacity=".9"/><stop offset="1" stop-color="#f5c04a" stop-opacity="0"/></radialGradient>
<pattern id="c-ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#0d1020" opacity=".22"/></pattern>
<radialGradient id="c-vig" cx=".5" cy=".55" r=".75"><stop offset=".5" stop-color="#0d1020" stop-opacity="0"/><stop offset="1" stop-color="#0d1020" stop-opacity=".8"/></radialGradient>
</defs>
<rect width="400" height="800" fill="url(#c-bg)"/>
<rect x="40" y="60" width="320" height="230" fill="#171b33" stroke="#232a4d" stroke-width="4"/>
<g class="c-bl" fill="#f5c04a"><rect x="44" y="76" width="312" height="8"/><rect x="44" y="104" width="312" height="8"/><rect x="44" y="132" width="312" height="8"/><rect x="44" y="160" width="312" height="8"/><rect x="44" y="188" width="312" height="8"/><rect x="44" y="216" width="312" height="8"/><rect x="44" y="244" width="312" height="8"/></g>
<circle class="c-glow" cx="64" cy="470" r="120" fill="url(#c-lg)"/>
