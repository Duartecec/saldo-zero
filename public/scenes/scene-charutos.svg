<g transform="translate(284 592)"><rect width="84" height="40" rx="3" fill="#cfd8a5" stroke="#1b1a24" stroke-width="2.5"/><rect y="-14" width="84" height="40" rx="3" fill="#dfe6b8" stroke="#1b1a24" stroke-width="2.5"/><rect x="30" y="-14" width="22" height="40" fill="#f5c04a" stroke="#1b1a24" stroke-width="2"/><text x="41" y="10" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="12" fill="#1b1a24">R$</text></g>
