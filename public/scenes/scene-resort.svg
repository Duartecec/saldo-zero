</g>
<g stroke="#2f3a78" stroke-width="3"><path d="M20 388H110M60 410H150M10 436H80M100 456H190M30 482H120M300 400H390M320 440H395M310 480H380"/></g>
<path class="r-tw" d="M232 318l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="#f3ecd9"/>
<path class="r-tw b" d="M318 300l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#f3ecd9"/>
<!-- palmeiras -->
<g class="r-palm"><path d="M34 560Q44 440 28 330" stroke="#1b1a24" stroke-width="12" fill="none"/><g fill="#0b6b46" stroke="#1b1a24" stroke-width="2.5"><path d="M28 330Q-10 320 -20 360Q18 330 28 330Z"/><path d="M28 330Q60 296 100 316Q56 316 28 330Z"/><path d="M28 330Q10 290 -14 284Q10 306 28 330Z"/><path d="M28 330Q56 330 84 362Q50 342 28 330Z"/><path d="M28 330Q34 296 62 276Q42 308 28 330Z"/></g></g>
<g class="r-palm b"><path d="M372 560Q360 460 380 380" stroke="#1b1a24" stroke-width="10" fill="none"/><g fill="#0b6b46" stroke="#1b1a24" stroke-width="2.5"><path d="M380 380Q420 370 430 410Q392 380 380 380Z"/><path d="M380 380Q344 348 306 366Q350 366 380 380Z"/><path d="M380 380Q396 340 420 334Q398 356 380 380Z"/><path d="M380 380Q352 384 328 414Q360 394 380 380Z"/></g></g>
<!-- terraço -->
<path d="M0 560H400V800H0Z" fill="#171b33"/>
<g stroke="#f3ecd9" stroke-width="4"><path d="M0 548H400"/></g>
<g stroke="#f3ecd9" stroke-width="3" opacity=".8"><path d="M30 548V572M90 548V572M150 548V572M210 548V572M270 548V572M330 548V572M390 548V572"/></g>
<!-- homens -->
<g stroke="#1b1a24" stroke-width="2.5">
 <g><path d="M12 650Q16 560 70 548Q124 560 128 650Z" fill="#2c3260"/><path d="M52 548L70 586L88 548Z" fill="#f3ecd9"/><path d="M66 562L70 594L74 562Z" fill="#e8283c"/><circle cx="70" cy="510" r="30" fill="#e0a672"/><path d="M42 502Q70 470 98 502Q96 486 70 482Q44 486 42 502Z" fill="#3a2a22"/><circle cx="60" cy="512" r="2.4" fill="#1b1a24" stroke="none"/><circle cx="80" cy="512" r="2.4" fill="#1b1a24" stroke="none"/><path d="M60 526Q70 532 80 526" fill="none" stroke-linecap="round"/></g>
 <g><path d="M104 650Q108 570 160 558Q212 570 216 650Z" fill="#171b33" stroke="#3a4278"/><path d="M142 558L160 596L178 558Z" fill="#f3ecd9"/><path d="M156 572L160 604L164 572Z" fill="#f5c04a"/><circle cx="160" cy="522" r="30" fill="#f0c08a"/><path d="M130 518Q130 486 160 488Q190 486 190 518Q184 498 160 498Q136 498 130 518Z" fill="#cfcabb"/><circle cx="150" cy="524" r="2.4" fill="#1b1a24" stroke="none"/><circle cx="170" cy="524" r="2.4" fill="#1b1a24" stroke="none"/><path d="M146 540Q160 550 174 540" fill="none" stroke-linecap="round"/></g>
 <g><path d="M184 650Q188 568 240 556Q292 568 296 650Z" fill="#2c3260"/><path d="M222 556L240 594L258 556Z" fill="#f3ecd9"/><path d="M236 570L240 602L244 570Z" fill="#e8283c"/><circle cx="240" cy="518" r="31" fill="#d49a63"/><ellipse cx="228" cy="496" rx="10" ry="5" fill="#f3ecd9" opacity=".5" stroke="none"/><circle cx="230" cy="520" r="2.4" fill="#1b1a24" stroke="none"/><circle cx="250" cy="520" r="2.4" fill="#1b1a24" stroke="none"/><path d="M226 536Q240 545 254 536" fill="none" stroke-linecap="round"/><path d="M224 530Q240 526 256 530" fill="none" stroke-width="4" stroke-linecap="round"/></g>
 <g><path d="M274 650Q278 560 332 548Q386 560 390 650Z" fill="#232a4d" stroke="#3a4278"/><path d="M314 548L332 586L350 548Z" fill="#f3ecd9"/><path d="M328 562L332 594L336 562Z" fill="#f5c04a"/><circle cx="332" cy="510" r="30" fill="#f0c08a"/><path d="M302 506Q304 474 332 474Q360 474 362 506Q352 486 332 486Q312 486 302 506Z" fill="#1b1a24"/><circle cx="322" cy="512" r="2.4" fill="#1b1a24" stroke="none"/><circle cx="342" cy="512" r="2.4" fill="#1b1a24" stroke="none"/><path d="M320 526Q332 534 344 526" fill="none" stroke-linecap="round"/></g>
</g>
<!-- braços/taças que brindam (homens 2 e 3) -->
<g transform="translate(184 600)"><g class="r-toast" style="transform-box:fill-box"><path d="M-22 40Q-22 10 0 10" stroke="#171b33" stroke-width="20" fill="none" stroke-linecap="round" transform="translate(0 20)"/><g transform="translate(0 0)"><path d="M-10 -20Q-10 0 0 4Q10 0 10 -20Z" fill="#f3ecd9" fill-opacity=".3" stroke="#f3ecd9" stroke-width="2.5"/><path d="M-8 -12Q-8 0 0 3Q8 0 8 -12Z" fill="#a31527"/><path d="M0 4V22M-8 22H8" stroke="#f3ecd9" stroke-width="2.5"/></g></g></g>
<g transform="translate(220 600)"><g class="r-toast b" style="transform-box:fill-box"><path d="M22 40Q22 10 0 10" stroke="#2c3260" stroke-width="20" fill="none" stroke-linecap="round" transform="translate(0 20)"/><g><path d="M-10 -20Q-10 0 0 4Q10 0 10 -20Z" fill="#f3ecd9" fill-opacity=".3" stroke="#f3ecd9" stroke-width="2.5"/><path d="M-8 -12Q-8 0 0 3Q8 0 8 -12Z" fill="#a31527"/><path d="M0 4V22M-8 22H8" stroke="#f3ecd9" stroke-width="2.5"/></g></g></g>
<!-- mesa -->
<path d="M0 640Q200 626 400 640V690H0Z" fill="#f3ecd9" stroke="#1b1a24" stroke-width="3"/>
<path d="M0 676H400" stroke="#f5c04a" stroke-width="4"/>
