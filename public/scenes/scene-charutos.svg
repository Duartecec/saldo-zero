 <g transform="rotate(4 200 560)"><rect x="190" y="380" width="24" height="210" rx="8" fill="#6b3e22"/><rect x="190" y="460" width="24" height="16" fill="#e8283c"/><rect x="190" y="380" width="24" height="14" rx="6" fill="#bdb6a6"/><circle class="c-em b" cx="202" cy="380" r="7.5" fill="#e8283c"/></g>
 <g transform="rotate(13 250 560)"><rect x="240" y="410" width="22" height="180" rx="8" fill="#8a5630"/><rect x="240" y="480" width="22" height="16" fill="#f5c04a"/><rect x="240" y="410" width="22" height="14" rx="6" fill="#bdb6a6"/><circle class="c-em c" cx="251" cy="410" r="7" fill="#e8283c"/></g>
