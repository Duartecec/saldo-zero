<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cabine de jatinho: uma mulher e um homem careca brindam; nuvens passam na janela">
<style>
.j-c1{animation:j-drift 18s linear infinite}
.j-c2{animation:j-drift 26s linear infinite -11s}
.j-c3{animation:j-drift 22s linear infinite -4s}
@keyframes j-drift{from{transform:translateX(-260px)}to{transform:translateX(300px)}}
.j-gl{animation:j-l 4s ease-in-out infinite}
.j-gr{animation:j-r 4s ease-in-out infinite}
@keyframes j-l{0%,52%,100%{transform:translate(0,0) rotate(0)}68%{transform:translate(9px,-3px) rotate(8deg)}76%{transform:translate(7px,-2px) rotate(4deg)}88%{transform:translate(0,0)}}
@keyframes j-r{0%,52%,100%{transform:translate(0,0) rotate(0)}68%{transform:translate(-9px,-3px) rotate(-8deg)}76%{transform:translate(-7px,-2px) rotate(-4deg)}88%{transform:translate(0,0)}}
.j-sp{transform-box:fill-box;transform-origin:center;opacity:0;animation:j-sp 4s ease-out infinite}
@keyframes j-sp{0%,64%{opacity:0;transform:scale(.2) rotate(0)}70%{opacity:1;transform:scale(1.3) rotate(20deg)}86%,100%{opacity:0;transform:scale(.7) rotate(40deg)}}
.j-bub{animation:j-bub 2.4s linear infinite}
@keyframes j-bub{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.j-lamp{animation:j-lamp 4s ease-in-out infinite}
@keyframes j-lamp{0%,100%{opacity:.55}50%{opacity:.9}}
.j-wing{animation:j-wing 4s ease-in-out infinite}
@keyframes j-wing{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
</style>
<defs>
