# Build de distribuição e envio ao TestFlight / App Store Connect.
#
# O xtool compila e assina para desenvolvimento em qualquer sistema, mas a assinatura de
# distribuição e o upload para a Apple só existem no macOS. Este workflow usa o xtool para
# gerar um projeto Xcode a partir do pacote SwiftPM e depois o xcodebuild para arquivar,
# exportar com assinatura automática (via chave da API do App Store Connect) e enviar.
#
# Segredos necessários no repositório:
#   ASC_KEY_ID      Key ID da chave da API (App Manager)
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      conteúdo do arquivo .p8 em base64 (base64 -i AuthKey_XXXX.p8)
#   APPLE_TEAM_ID   Team ID (10 caracteres)
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion (inteiro crescente)"
        required: true
        default: "1"

jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Instalar xtool
        run: brew install xtool-org/tap/xtool

      - name: Chave da API do App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Sincronizar o jogo e definir número de build
        working-directory: ios
        run: |
          ./sync-game.sh
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" Support/Info.plist

      - name: Gerar projeto Xcode com xtool
        working-directory: ios
        run: xtool dev generate-xcode-project

      - name: Arquivar
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          PROJ=$(ls -d xtool/.xtool-tmp/*.xcodeproj | head -1)
          xcodebuild -project "$PROJ" -scheme SaldoZero -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/SaldoZero.xcarchive archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates -allowProvisioningDeviceRegistration \
            -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Exportar e enviar ao App Store Connect
        working-directory: ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath build/SaldoZero.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saldozero-export
          path: ios/build/export
          if-no-files-found: ignore
