<linearGradient id="j-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1020"/><stop offset="1" stop-color="#1c2140"/></linearGradient>
<clipPath id="j-win"><rect x="92" y="110" width="216" height="290" rx="108"/></clipPath>
<pattern id="j-ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#0d1020" opacity=".22"/></pattern>
<radialGradient id="j-vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#0d1020" stop-opacity="0"/><stop offset="1" stop-color="#0d1020" stop-opacity=".75"/></radialGradient>
</defs>
