<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Homens de terno tomando vinho no terraço de um resort ao pôr do sol">
<style>
.r-sun{transform-box:fill-box;transform-origin:center;animation:r-sun 4s ease-in-out infinite}
@keyframes r-sun{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.r-rf{animation:r-rf 2.4s ease-in-out infinite}
.r-rf.b{animation-delay:-.8s}.r-rf.c{animation-delay:-1.6s}
@keyframes r-rf{0%,100%{opacity:.25;transform:scaleX(.7)}50%{opacity:.9;transform:scaleX(1.2)}}
.r-rf{transform-box:fill-box;transform-origin:center}
.r-tw{transform-box:fill-box;transform-origin:center;animation:r-tw 2.6s ease-in-out infinite}
.r-tw.b{animation-delay:-1.3s}
@keyframes r-tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.r-palm{transform-box:fill-box;transform-origin:50% 100%;animation:r-palm 5s ease-in-out infinite}
.r-palm.b{animation-duration:6.5s;animation-delay:-2s}
@keyframes r-palm{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
.r-wine{transform-box:fill-box;transform-origin:center;animation:r-wine 1.6s ease-in-out infinite}
.r-wine.b{animation-delay:-.5s}.r-wine.c{animation-delay:-1s}.r-wine.d{animation-delay:-.25s}
@keyframes r-wine{0%,100%{transform:translateX(-2.5px) rotate(-5deg)}50%{transform:translateX(2.5px) rotate(5deg)}}
.r-toast{animation:r-toast 4s ease-in-out infinite}
.r-toast.b{animation-name:r-toastb}
@keyframes r-toast{0%,55%,100%{transform:translate(0,0)}70%{transform:translate(8px,-12px)}85%{transform:translate(0,0)}}
@keyframes r-toastb{0%,55%,100%{transform:translate(0,0)}70%{transform:translate(-8px,-12px)}85%{transform:translate(0,0)}}
.r-pool{animation:r-pool 3.2s linear infinite}
@keyframes r-pool{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
</style>
<defs>
<linearGradient id="r-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2146"/><stop offset=".55" stop-color="#e8283c"/><stop offset="1" stop-color="#f5c04a"/></linearGradient>
<radialGradient id="r-gl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f5c04a" stop-opacity=".85"/><stop offset="1" stop-color="#f5c04a" stop-opacity="0"/></radialGradient>
<clipPath id="r-pc"><rect x="0" y="700" width="400" height="100"/></clipPath>
<pattern id="r-ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="#0d1020" opacity=".2"/></pattern>
<radialGradient id="r-vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#0d1020" stop-opacity="0"/><stop offset="1" stop-color="#0d1020" stop-opacity=".7"/></radialGradient>
</defs>
<rect width="400" height="420" fill="url(#r-sky)"/>
<circle cx="270" cy="330" r="150" fill="url(#r-gl)"/>
<circle class="r-sun" cx="270" cy="340" r="62" fill="#f5c04a"/>
<path d="M0 360H400V560H0Z" fill="#232a5a"/>
<path d="M0 360H400" stroke="#f5c04a" stroke-width="3"/>
<g fill="#f5c04a">
