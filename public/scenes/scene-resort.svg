<g transform="translate(70 630)"><path d="M-12 -26Q-12 0 0 4Q12 0 12 -26Z" fill="#f3ecd9" fill-opacity=".3" stroke="#1b1a24" stroke-width="2.5"/><g clip-path="none"><ellipse class="r-wine" cx="0" cy="-8" rx="9" ry="4" fill="#a31527"/></g><path d="M-8 -8Q-8 0 0 3Q8 0 8 -8Z" fill="#a31527"/><path d="M0 4V22M-9 22H9" stroke="#1b1a24" stroke-width="2.5"/></g>
<g transform="translate(332 630)"><path d="M-12 -26Q-12 0 0 4Q12 0 12 -26Z" fill="#f3ecd9" fill-opacity=".3" stroke="#1b1a24" stroke-width="2.5"/><ellipse class="r-wine c" cx="0" cy="-8" rx="9" ry="4" fill="#d1334a"/><path d="M-8 -8Q-8 0 0 3Q8 0 8 -8Z" fill="#a31527"/><path d="M0 4V22M-9 22H9" stroke="#1b1a24" stroke-width="2.5"/></g>
<!-- balde de gelo com garrafa -->
<g transform="translate(202 650)"><rect x="-4" y="-44" width="8" height="40" rx="3" fill="#0b4a35" stroke="#1b1a24" stroke-width="2"/><path d="M-22 -10H22L16 26H-16Z" fill="#8fb4d9" stroke="#1b1a24" stroke-width="2.5"/></g>
<!-- piscina -->
<path d="M0 690H400V800H0Z" fill="#2f3a78"/>
<g clip-path="url(#r-pc)"><g class="r-pool" stroke="#8fb4d9" stroke-width="3" fill="none" stroke-linecap="round"><path d="M-20 720Q0 710 20 720T60 720T100 720T140 720T180 720T220 720T260 720T300 720T340 720T380 720T420 720"/><path d="M-30 756Q-10 746 10 756T50 756T90 756T130 756T170 756T210 756T250 756T290 756T330 756T370 756T410 756"/></g></g>
<rect width="400" height="800" fill="url(#r-ht)"/>
<rect width="400" height="800" fill="url(#r-vig)"/>
</svg>
